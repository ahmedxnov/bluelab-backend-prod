# Alembic — one linear lineage, one head, forward-only (data/04 §1).
#
# Down-migrations are not written and not trusted: the rollback of record for a bad
# migration is point-in-time restore plus a forward fix. At this team size, honest
# PITR beats fictional downgrade() code.
#
# Migrations run from the deploy pipeline under the MIGRATION role — the only role
# holding BYPASSRLS — before app rollout of the release that needs them, and with a
# bounded lock_timeout that fails fast (pipeline/04 §1).
#
# RLS policies, freeze triggers, the banding function, and the V-1…V-11 views never
# come from autogenerate. They live in ../sql/ and are re-applied idempotently at
# every release, then diffed by tools/check_rls_drift.py (data/04 §3).
#
# Procrastinate owns its own tables; its library migrations are PINNED to the
# library version and wrapped as steps of this lineage, so a restore plus
# `alembic upgrade head` always converges (data/04 §4).

[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# The URL is supplied by the environment (MIGRATION_DATABASE_URL); no connection
# string is committed.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
