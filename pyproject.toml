[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluelab-backend"
version = "0.0.0"
description = "BlueLab v1 — application plane and work plane (ADR-0002, ADR-0012, ADR-0071)"
requires-python = "==3.12.*"
license = { text = "Proprietary" }

# The application plane: FastAPI + SQLAlchemy 2 + Alembic + Pydantic v2 (ADR-0012).
# Versions are pinned in the lockfile, and the lockfile digest is verified in the
# build (pipeline/02 §4.2). Nothing here is host-specific — the extension
# allowlist is empty and the schema must stay portable (data/04 §8).
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic[email]>=2",           # EmailStr — api/openapi.yaml specifies format: email
  "pydantic-settings",
  "sqlalchemy>=2",
  "alembic",                      # one linear lineage, forward-only (data/04 §1)
  "asyncpg",
  "psycopg[binary]",              # migrations + the sync tooling paths
  "procrastinate",                # C-12 — transactional enqueue (ADR-0023)
  "argon2-cffi",                  # C-18 — argon2id (ADR-0028)
  "valkey",                       # C-13 — sessions, leases, registry (ADR-0024)
  "boto3",                        # C-11 object store + C-14 SES + C-17 secrets
  "httpx",
  "tenacity",                     # timeouts + backoff on every external call
  "structlog",
  "uuid-utils",                   # UUIDv7, minted application-side (ADR-0030)
  "python-multipart",
  "livekit-api",                  # C-1 — tokens, egress, webhook verification
  "anthropic",                    # C-6 evaluator / C-7 generation (ADR-0018)
  "azure-ai-documentintelligence",# C-8 — extraction (ADR-0020)
  "playwright",                   # C-9 — Chromium PDF render (ADR-0021)
  "opentelemetry-sdk",            # C-16 (ADR-0027)
  "opentelemetry-exporter-otlp",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-sqlalchemy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",                   # property tests for the V-1…V-11 formulas (L1)
  "fakeredis",                    # the L3 auth suite's coordination store (see its conftest)
  "mutmut",                       # mutation testing, invariant paths only (quality/01 §4)
  "schemathesis",                 # L2 contract validation
  "ruff",
  "mypy",
  "import-linter",                # the ADR-0012 module-boundary lint — build-failing
  "detect-secrets",               # SEC-019 (pipeline/02 §2 row 9)
  "pyyaml",                       # tools/check_conformance_diff.py reads api/openapi.yaml
]

[project.scripts]
bluelab-api = "bluelab.entrypoints.api:main"
bluelab-worker = "bluelab.entrypoints.worker:main"
bluelab-sweeper = "bluelab.entrypoints.sweeper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bluelab", "src/bluelab_runtime_bundle"]

# ---------------------------------------------------------------------------
# The module-boundary lint (ADR-0012, ADR-0002).
#
# "Module boundaries inside one process are a discipline, not a physical
# constraint, and erode unless enforced" — ADR-0002. These contracts are what
# makes cross-module reach into another module's stored state a BUILD FAILURE
# rather than a review finding. Commit gate stage 1 (pipeline/02 §2).
#
# Cross-module FOREIGN KEYS are legal and used freely (data/00 §4). It is
# cross-module CODE REACH that is forbidden. Callers enter through `service.py`.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["bluelab", "bluelab_runtime_bundle"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "The planes are layered"
type = "layers"
layers = [
  "bluelab.entrypoints",
  "bluelab.api",
  "bluelab.calls",
  "bluelab.work",
  "bluelab.modules",
  "bluelab.notifications",
  "bluelab.adapters",
  "bluelab.platform",
]

[[tool.importlinter.contracts]]
name = "Privileged scope is unreachable from the product surface"
type = "forbidden"
source_modules = ["bluelab.modules", "bluelab.notifications"]
forbidden_modules = ["bluelab.platform.db.privileged"]
# system scope reaches every row in an org; ops scope carries no org at all.
# The legitimate callers are the worker context, the signed internal seam, and
# ops-session resolution in bluelab.api.deps — never a domain module.

[[tool.importlinter.contracts]]
name = "Only the bundle builder may touch the call-plane contract package"
type = "forbidden"
source_modules = ["bluelab.modules", "bluelab.work", "bluelab.notifications", "bluelab.api"]
forbidden_modules = ["bluelab_runtime_bundle"]

[[tool.importlinter.contracts]]
name = "identity: no cross-module reach into stored state"
type = "forbidden"
source_modules = [
  "bluelab.modules.knowledge", "bluelab.modules.drills", "bluelab.modules.review",
  "bluelab.modules.training", "bluelab.modules.hiring", "bluelab.modules.assessment",
  "bluelab.modules.operations",
]
forbidden_modules = ["bluelab.modules.identity.models", "bluelab.modules.identity.router"]

[[tool.importlinter.contracts]]
name = "knowledge: no cross-module reach into stored state"
type = "forbidden"
source_modules = [
  "bluelab.modules.identity", "bluelab.modules.drills", "bluelab.modules.review",
  "bluelab.modules.training", "bluelab.modules.hiring", "bluelab.modules.assessment",
  "bluelab.modules.operations",
]
forbidden_modules = ["bluelab.modules.knowledge.models", "bluelab.modules.knowledge.router"]

[[tool.importlinter.contracts]]
name = "drills: no cross-module reach into stored state"
type = "forbidden"
source_modules = [
  "bluelab.modules.identity", "bluelab.modules.knowledge", "bluelab.modules.review",
  "bluelab.modules.training", "bluelab.modules.hiring", "bluelab.modules.assessment",
  "bluelab.modules.operations",
]
forbidden_modules = ["bluelab.modules.drills.models", "bluelab.modules.drills.router"]

[[tool.importlinter.contracts]]
name = "review: no cross-module reach into stored state"
type = "forbidden"
source_modules = [
  "bluelab.modules.identity", "bluelab.modules.knowledge", "bluelab.modules.drills",
  "bluelab.modules.training", "bluelab.modules.hiring", "bluelab.modules.assessment",
  "bluelab.modules.operations",
]
forbidden_modules = ["bluelab.modules.review.models", "bluelab.modules.review.router"]

[[tool.importlinter.contracts]]
name = "training: no cross-module reach into stored state"
type = "forbidden"
source_modules = [
  "bluelab.modules.identity", "bluelab.modules.knowledge", "bluelab.modules.drills",
  "bluelab.modules.review", "bluelab.modules.hiring", "bluelab.modules.assessment",
  "bluelab.modules.operations",
]
forbidden_modules = ["bluelab.modules.training.models", "bluelab.modules.training.router"]

[[tool.importlinter.contracts]]
name = "hiring: no cross-module reach into stored state"
type = "forbidden"
source_modules = [
  "bluelab.modules.identity", "bluelab.modules.knowledge", "bluelab.modules.drills",
