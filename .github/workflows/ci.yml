name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bluelab_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bluelab_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: src
      DATABASE_URL: postgresql+asyncpg://bluelab_app:bluelab@127.0.0.1:5433/bluelab_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://bluelab:bluelab@127.0.0.1:5433/bluelab_test
      TEST_MIGRATION_URL: postgresql+asyncpg://bluelab:bluelab@127.0.0.1:5433/bluelab_test
      TEST_DATABASE_URL: postgresql+asyncpg://bluelab_app:bluelab@127.0.0.1:5433/bluelab_test
      VALKEY_URL: redis://127.0.0.1:6379/0
      AGENT_HMAC_SECRET: test-secret-not-real
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the hash-locked toolchain
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci
      - name: Bootstrap database roles
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 5433 -U postgres -d bluelab_test
          -v ON_ERROR_STOP=1 -v migration_role=bluelab -v app_role=bluelab_app
          -v role_password=bluelab -v database_name=bluelab_test
          -f sql/roles/bootstrap.sql
      - name: Initialize the test database
        run: |
          python -m alembic upgrade head
          python tools/generate_rls_policies.py
          python tools/check_rls_drift.py --apply
      - name: Verify vendored boundaries
        run: |
          python tools/verify_contract_lock.py
          python tools/verify_runtime_bundle_lock.py
          python tools/verify_design_tokens.py
      - name: Static and architecture gates
        run: |
          ruff check src tools tests migrations
          mypy src tools
          lint-imports
          python tools/scan_tier_branches.py
          python tools/audit_cookie_attributes.py
          python tools/check_telemetry_content_free.py
          python tools/check_fixture_safety.py
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Contract and requirement ratchets
        run: |
          python tools/check_conformance_diff.py
          python tools/check_requirement_coverage.py
      - name: Test
        run: python -m pytest tests -q -p no:hypothesispytest -p no:schemathesis

  container:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the independently deployable image
        run: docker build --tag bluelab-backend:${{ github.sha }} .
