# Local environment (infra/00 §1).
#
# `local` is one of exactly three environments — local, staging, prod. There is no
# shared dev server (the team is 1–3 people, so local *is* dev) and no ephemeral
# per-PR environment: the expensive part of this product, live voice, cannot be
# meaningfully exercised per-PR anyway, so PRs are covered by contract tests
# against the Prism mock (ADR-0047, ADR-0035).
#
# Parity rule 1 is binding: **one engine version everywhere**. The postgres tag
# below is PostgreSQL 16, the same major as staging and prod (infra/00 §2).
#
# Named local deviations, decided rather than discovered (infra/00 §3):
#   * no LiveKit egress and no real PDF render unless opted in;
#   * vendor fixture mode — deterministic tests without spend.
#
# Bring-up target: `docker compose up` + `alembic upgrade head` + the seed CLI in
# under **10 minutes** from a clean clone. That figure is a Definition-of-Done item
# and a timed commit-gate stage (infra/00 §4, pipeline/02 §2 row 11).

services:
  postgres:
    image: postgres:16
    # Holds everything: the domain schema, the Procrastinate queue tables, and the
    # session/auth tables. One database, one lineage (ADR-0023, ADR-0028).
    environment:
      # The image grants POSTGRES_USER superuser power. Keep that bootstrap
      # identity separate; sql/roles/bootstrap.sql creates the constrained
      # migration and application roles used after initialization.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bluelab
      POSTGRES_DB: bluelab
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./sql/roles/bootstrap.sql:/docker-entrypoint-initdb.d/10-bluelab-roles.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bluelab"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8
    # C-13 coordination store: sessions, the single-live-call lease, the live-call
    # registry, placement. Deliberately volatile — nothing here survives its call
    # (ADR-0024, architecture/00 §3.4).
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    # C-11 object store, local implementation. The S3 API is the contract; the
    # implementation is configuration (ADR-0025).
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bluelab
      MINIO_ROOT_PASSWORD: bluelabbluelab
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    # C-14 local mail sink. Staging uses the SES sandbox; prod uses SES production
    # access (infra/00 §1).
    ports: ["1025:1025", "8025:8025"]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: ["runtime"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc --config-dir /tmp/.mc alias set local http://minio:9000 bluelab bluelabbluelab
        mc --config-dir /tmp/.mc mb --ignore-existing local/bluelab-local
        mc --config-dir /tmp/.mc mb --ignore-existing local/bluelab-lifecycle-history
        mc --config-dir /tmp/.mc version enable local/bluelab-lifecycle-history
        mc --config-dir /tmp/.mc mb --ignore-existing local/bluelab-erasure-ledger
        mc --config-dir /tmp/.mc mb --ignore-existing local/bluelab-erasure-ledger-backup
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
    image: bluelab-backend:local
    profiles: ["runtime"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://bluelab:bluelab@postgres:5432/bluelab # pragma: allowlist secret -- disposable local Compose credential
    command:
      - /bin/sh
      - -ec
      - |
        python -m alembic upgrade head
        python tools/check_rls_drift.py --apply
    healthcheck:
      disable: true
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true

  api:
    build:
      context: .
    image: bluelab-backend:local
    profiles: ["runtime"]
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      BLUELAB_PLANE: api
      BLUELAB_ENV: local
      DATABASE_URL: postgresql+asyncpg://bluelab_app:bluelab@postgres:5432/bluelab # pragma: allowlist secret -- disposable local Compose credential
      VALKEY_URL: redis://valkey:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
      SMTP_URL: smtp://mailpit:1025
    ports: ["8000:8000"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 30s

  worker:
    build:
      context: .
    image: bluelab-backend:local
    profiles: ["runtime"]
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      BLUELAB_PLANE: worker
      BLUELAB_ENV: local
      TZ: Etc/UTC
      DATABASE_URL: postgresql+asyncpg://bluelab_app:bluelab@postgres:5432/bluelab # pragma: allowlist secret -- disposable local Compose credential
      VALKEY_URL: redis://valkey:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
      SMTP_URL: smtp://mailpit:1025
    command: ["python", "-m", "bluelab.entrypoints.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "bluelab.entrypoints.worker_health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 30s

volumes:
  pgdata:
  miniodata:
